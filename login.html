<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    /> -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/loginStyleSheet.css" />
  </head>
  <body>
    <div>
      <div class="form-container">
        <form>
          <h1>Login</h1>
          <div class="input-container">
            <input id="userInput" type="text" placeholder="Username" />
            <span class="material-symbols-outlined">account_circle</span>
          </div>
          <div class="input-container">
            <input id="keyInput" type="text" placeholder="Password" />
            <span class="material-symbols-outlined">visibility</span>
          </div>
          <div class="btn-div">
            <button class="btn" type="button" onclick="login()">Login</button>
            <br />
            <p>New user?<a href="#">Sign up</a></p>
            <p id="sign-up-text"></p>
          </div>
        </form>
      </div>
    </div>

    <script src="./assets/js/loginPage.js"></script>
  </body>
</html>
